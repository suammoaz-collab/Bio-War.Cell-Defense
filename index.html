<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cellular Guard: Bio Defense</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; height: 100%; background: #020804; color: #00ffcc; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; overflow: hidden; }

/* Screens */
.scr { position: fixed; inset: 0; background: radial-gradient(circle at center, #062013 0%, #010a04 70%, #000 100%); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 5; overflow-y: auto; padding: 15px; text-align: center; }
.scr.on { display: flex; }

/* Glowing Typography & UI */
h1 { margin: 0; font-size: 32px; color: #00ffcc; text-shadow: 0 0 15px rgba(0, 255, 204, 0.8), 0 0 30px rgba(0, 255, 100, 0.4); letter-spacing: 1px; }
h2 { margin: 0; font-size: 22px; color: #33ff88; text-shadow: 0 0 10px rgba(51, 255, 136, 0.6); }

.b { background: linear-gradient(135deg, #032e18, #011a0d); color: #00ffcc; border: 2px solid #00ffcc; border-radius: 10px; padding: 10px 22px; font-size: 16px; font-weight: bold; margin: 4px; box-shadow: 0 0 12px rgba(0, 255, 204, 0.3); font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
.b:active { transform: scale(0.95); background: #00ffcc; color: #000; }
.b.sel { background: #00ffcc; color: #020804; box-shadow: 0 0 20px #00ffcc; }
.b:disabled { opacity: 0.3; cursor: not-allowed; }

input { background: #021208; color: #00ffcc; border: 2px solid #00ffcc; border-radius: 8px; padding: 9px; font-size: 16px; width: 180px; text-align: center; outline: none; box-shadow: inset 0 0 8px rgba(0,255,204,0.2); }

.card { background: rgba(2, 25, 12, 0.7); border: 1px solid rgba(0, 255, 204, 0.4); border-radius: 10px; padding: 10px 14px; margin: 6px; font-size: 14px; max-width: 580px; text-align: right; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

#game { position: fixed; inset: 0; display: none; flex-direction: row; direction: ltr; background: #000; }
#cw { flex: 1; display: flex; align-items: center; justify-content: center; background: #010804; }
#side { width: 115px; padding: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; overflow-y: auto; background: #021208; text-align: center; border-left: 2px solid #00ffcc; box-shadow: -5px 0 20px rgba(0,255,204,0.2); }

.t { background: #032413; color: #00ffcc; border: 2px solid #00aa66; border-radius: 8px; padding: 6px; font-size: 11px; font-weight: bold; font-family: inherit; cursor: pointer; }
.t.sel { border-color: #00ffcc; background: #006633; box-shadow: 0 0 10px #00ffcc; }
</style>
</head>
<body>

<!-- Splash Screen -->
<div class="scr on" id="splash">
  <h1 data-t="title">Cellular Guard: Bio Defense</h1>
  <p style="color:#00bb77; font-size: 14px; margin-bottom: 10px;">[ BIO-SECURITY THREAT LEVEL 300 ]</p>
  <button class="b" onclick="show('menu')" data-t="start">ابدأ اللعب</button>
</div>

<!-- Main Menu -->
<div class="scr" id="menu">
  <h2 data-t="title">Cellular Guard</h2>
  <div>
    <button class="b" id="ca" onclick="pick('animal')" data-t="animal">خلية حيوانية</button>
    <button class="b" id="cp" onclick="pick('plant')" data-t="plant">خلية نباتية</button>
  </div>
  <div id="cdesc" style="color: #66ffaa; font-size: 14px; margin: 4px 0;"></div>
  <div style="margin: 8px 0;">
    <button class="b" onclick="lv(-1)">-</button>
    <span style="font-size: 18px; font-weight: bold;"><span data-t="level">المستوى</span> <b id="lv" style="color:#fff;">1</b></span>
    <button class="b" onclick="lv(1)">+</button>
  </div>
  <div style="font-size: 18px; margin-bottom: 6px;">🪙 <b id="mc" style="color:#ffcc00;">0</b> <b id="pb" style="color:#00ffcc;"></b></div>
  <div>
    <button class="b" onclick="startGame()" data-t="play">العب</button>
    <button class="b" onclick="show('shop')" data-t="shop">المتجر</button>
    <button class="b" onclick="show('book')" data-t="book">الموسوعة</button>
    <button class="b" onclick="show('set')" data-t="settings">الإعدادات</button>
  </div>
</div>

<!-- Shop Screen -->
<div class="scr" id="shop">
  <h2><span data-t="shop">المتجر</span> | 🪙 <span id="sc" style="color:#ffcc00;">0</span></h2>
  <div id="ups" style="width: 100%; max-width: 400px;"></div>
  <div style="margin-top: 10px;">
    <input id="cd" data-ph="code" placeholder="أدخل الكود">
    <button class="b" onclick="promo()" data-t="apply">تفعيل</button>
  </div>
  <div id="pm" style="color: #ffcc00; font-weight: bold; margin-top: 5px; min-height: 20px;"></div>
  <button class="b" onclick="show('menu')" data-t="back">رجوع</button>
</div>

<!-- Encyclopedia Screen -->
<div class="scr" id="book">
  <h2 data-t="book">الموسوعة الطبية</h2>
  <div id="bk"></div>
  <button class="b" onclick="show('menu')" data-t="back">رجوع</button>
</div>

<!-- Settings Screen -->
<div class="scr" id="set">
  <h2 data-t="settings">الإعدادات</h2>
  <div style="margin: 10px 0;"><span data-t="sound">الصوت</span> <input type="range" id="vol" min="0" max="1" step="0.1" style="width:140px;" oninput="S.vol=+this.value;save();beep(500,.1)"></div>
  <div style="margin: 10px 0;"><span data-t="lang">اللغة</span> <button class="b" onclick="setLang('ar')">عربي</button><button class="b" onclick="setLang('en')">English</button></div>
  <button class="b" onclick="show('menu')" data-t="back">رجوع</button>
</div>

<!-- Result Screen -->
<div class="scr" id="res">
  <h1 id="rt"></h1>
  <div id="rg" style="font-size: 20px; color:#ffcc00; margin: 10px 0;"></div>
  <div>
    <button class="b" id="nx" onclick="nextL()" data-t="next">المستوى التالي</button>
    <button class="b" onclick="startGame()" data-t="retry">إعادة</button>
    <button class="b" onclick="show('menu')" data-t="menu">القائمة</button>
  </div>
</div>

<!-- Game Viewport -->
<div id="game">
  <div id="cw"><canvas id="cv" width="800" height="350"></canvas></div>
  <div id="side">
    <div>🪙 <b id="hc" style="color:#ffcc00;">0</b></div>
    <div>⚡ <b id="he" style="color:#00ffcc;">0</b></div>
    <div>🛡️ <b id="hw" style="color:#33ff88;">100%</b></div>
    <div><span data-t="level">المستوى</span> <b id="hl">1</b></div>
    <button class="t" id="tb0" onclick="sel(0)"></button>
    <button class="t" id="tb1" onclick="sel(1)"></button>
    <button class="t" id="tb2" onclick="sel(2)"></button>
    <button class="t" onclick="G.paused=!G.paused" data-t="pause">إيقاف</button>
    <button class="t" onclick="show('menu')" data-t="menu">القائمة</button>
  </div>
</div>
<script>
const T={
  ar:{title:"حرب الميكروبات: الدفاع الحيوي",start:"ابدأ اللعب",settings:"الإعدادات",play:"العب",shop:"المتجر",book:"الموسوعة",back:"رجوع",sound:"الصوت",lang:"اللغة",animal:"خلية حيوانية",plant:"خلية نباتية",animalD:"سيتوبلازم مرن + طاقة سريعة",plantD:"جدار خلوي قوي جداً ومصفح",level:"المستوى",up_wall:"الجدار الخلوي",up_cyto:"قوة السيتوبلازم",up_en:"إنتاج الطاقة",up_wpn:"الأسلحة والمضادات",code:"أدخل الكود (مثل PRO-1234)",apply:"تفعيل",bad:"كود خطأ أو غير صالح",used:"تم استخدام هذا الكود من قبل",pro:"تم فتح حساب VIP PRO بنجاح!",win:"انتصار بيولوجي!",lose:"انهيار المناعة!",next:"المستوى التالي",retry:"إعادة المحاولة",menu:"القائمة",pause:"إيقاف مؤقت",virus:"فيروس جيني",bact:"بكتيريا شرسة",fung:"فطر عملاق",weak:"نقطة الضعف",tool:"السلاح الفعال",t0:"مضاد حيوي",t1:"مضاد فيروسات",t2:"مضاد فطريات",vd:"سريع وشرس، لا يملك غلاف خلوي ويتكاثر بسرعة.",bd:"متوسط القوة، يفرز سموماً تخترق الجدران الضعيفة.",fd:"بطيء وصلب بجدار كيتيني سميك، لا يؤثره إلا مضاد الفطريات.",gain:"العملات المكتسبة"},
  en:{title:"Cellular Guard: Bio Defense",start:"Start Game",settings:"Settings",play:"Play",shop:"Shop",book:"Encyclopedia",back:"Back",sound:"Sound",lang:"Language",animal:"Animal Cell",plant:"Plant Cell",animalD:"Flexible cytoplasm + fast energy",plantD:"Very strong reinforced cell wall",level:"Level",up_wall:"Cell Wall",up_cyto:"Cytoplasm Power",up_en:"Energy Production",up_wpn:"Weapons & Antibiotics",code:"Enter code (e.g. PRO-1234)",apply:"Apply",bad:"Invalid or expired code",used:"Code already used",pro:"VIP PRO Account Unlocked!",win:"Biological Victory!",lose:"Immunity Collapse!",next:"Next Level",retry:"Retry",menu:"Menu",pause:"Pause",virus:"Genetic Virus",bact:"Aggressive Bacteria",fung:"Giant Fungus",weak:"Weakness",tool:"Effective Weapon",t0:"Antibiotic",t1:"Antiviral",t2:"Antifungal",vd:"Fast and aggressive, multiplies rapidly.",bd:"Medium strength, secretes destructive toxins.",fg:"Slow and heavily armored, requires specialized antifungals.",gain:"Coins Earned"}
};

let S={lang:'ar',cell:'animal',lvl:1,max:1,coins:150,up:{wall:0,cyto:0,en:0,wpn:0},pro:false,used:[],vol:0.5};
const $=id=>document.getElementById(id);
const t=k=>T[S.lang][k]||k;

function save(){try{localStorage.setItem('mbw_save',JSON.stringify(S))}catch(e){}}
try{Object.assign(S,JSON.parse(localStorage.getItem('mbw_save')||'{}'))}catch(e){}

let ac;
function beep(f,d){
  if(!S.vol)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=f; g.gain.value=S.vol*0.12;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+d);
  }catch(e){}
}

const E=[
  {k:'virus',hp:35,sp:45,d:6,c:'#ff00ff',tool:1,ic:'🦠'},
  {k:'bact',hp:70,sp:28,d:10,c:'#ff9900',tool:0,ic:'🧫'},
  {k:'fung',hp:150,sp:16,d:16,c:'#00ccff',tool:2,ic:'🍄'}
];
const TW=[
  {cost:40,c:'#00ff66',dmg:12,ic:'💊'},
  {cost:70,c:'#00ffff',dmg:14,ic:'💉'},
  {cost:100,c:'#ffcc00',dmg:18,ic:'🧪'}
];

const cv=$('cv'), cx=cv.getContext('2d'), W=800, H=350, C0=60, CW=68, RH=70;
let G=null, last=0;

function show(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));
  $('game').style.display=id=='game'?'flex':'none';
  if(id!='game'&&G)G.run=false;
  refresh();
}

function setLang(l){S.lang=l; save(); refresh();}

function refresh(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  
  $('ca').classList.toggle('sel',S.cell=='animal');
  $('cp').classList.toggle('sel',S.cell=='plant');
  $('cdesc').textContent=t(S.cell=='animal'?'animalD':'plantD');
  $('lv').textContent=S.lvl+' / 300';
  $('mc').textContent=Math.floor(S.coins);
  $('sc').textContent=Math.floor(S.coins);
  $('pb').textContent=S.pro?'⭐ VIP PRO':'';
  $('vol').value=S.vol;

  for(let i=0;i<3;i++) $('tb'+i).innerHTML=TW[i].ic+'<br>'+t('t'+i)+'<br>'+TW[i].cost+'⚡';
  if(G) sel(G.sel);

  let u='';
  for(const k of ['wall','cyto','en','wpn']){
    const n=S.up[k];
    u+=`<div style="margin:4px 0;"><button class="b" style="width:100%;font-size:13px;padding:6px;" ${n>=20?'disabled':''} onclick="buy('${k}')">${t('up_'+k)} [${n}/20] — ${n>=20?'MAX':cost(k)+' 🪙'}</button></div>`;
  }
  $('ups').innerHTML=u;

  let b='';
  for(const e of E){
    b+=`<div class="card"><b>${e.ic} ${t(e.k)}</b><br>${t(e.k[0]+'d')}<br>${t('weak')} / ${t('tool')}: <b style="color:#00ffcc;">${t('t'+e.tool)}</b></div>`;
  }
  $('bk').innerHTML=b;
}

function cost(k){ return Math.round(90*Math.pow(S.up[k]+1,1.5)); }

function buy(k){
  if(S.up[k]>=20||S.coins<cost(k)){beep(150,.2);return;}
  S.coins-=cost(k); S.up[k]++; save(); beep(700,.1); refresh();
}

// نظام توليد الأكواد السرية العشوائية والخاصة (مثل كود أخوك MARWAN_PRO أو أكواد PRO العشوائية)
function promo(){
  let cd=$('cd').value.trim().toUpperCase();
  let m='';
  
  // شروط قبول الكود: إما الكود المخصص لأخوك أو أي كود يبدأ بـ PRO- أو VIP- متبوعاً بأرقام
  let isCustom = (cd === 'MARWAN_PRO' || cd === 'REV_VIP' || cd.startsWith('PRO-') || cd.startsWith('VIP-'));

  if(!isCustom){
    m=t('bad');
    beep(120,.3);
  }else if(S.used.includes(cd)){
    m=t('used');
    beep(150,.3);
  }else{
    S.used.push(cd);
    S.coins+=50000;
    S.pro=true;
    save();
    m=t('pro')+' +50,000 🪙';
    beep(950,.4);
  }
  refresh();
  $('pm').textContent=m;
}

function pick(c){S.cell=c; save(); refresh();}
function lv(d){S.lvl=Math.max(1,Math.min(300,S.lvl+d)); save(); refresh();}
function sel(i){if(G)G.sel=i; for(let j=0;j<3;j++) $('tb'+j).classList.toggle('sel',j==i);}

function fit(){
  const r=$('cw').getBoundingClientRect(), s=Math.min(r.width/W, r.height/H);
  cv.style.width=W*s+'px'; cv.style.height=H*s+'px';
}
window.addEventListener('resize', fit);

function startGame(){
  const pl=S.cell=='plant', L=S.lvl;
  const wm=(180+S.up.wall*75)*(pl?2.5:1), n=Math.min(8+(L>>1),70);
  G={
    en:100, wh:wm, wm, es:[], ts:[], bs:[], sel:0, sp:1, left:n, gain:0,
    run:true, paused:false, L,
    hm:1+(L-1)*.05, sm:1+Math.min((L-1)*.003,1.5)
  };
  show('game'); fit();
  last=performance.now();
  requestAnimationFrame(loop);
}

function nextL(){ S.lvl=Math.min(S.lvl+1,300); save(); startGame(); }

function spawn(){
  const L=G.L, av=L>=5?3:L>=3?2:1, i=Math.floor(Math.random()*av);
  const hp=E[i].hp*G.hm;
  G.es.push({x:W+20, r:Math.floor(Math.random()*5), hp, mx:hp, i});
}

function end(w){
  G.run=false;
  let g=G.gain;
  if(w){ g+=25+G.L*6; S.max=Math.max(S.max,Math.min(G.L+1,300)); }
  S.coins+=g; save();
  $('rt').textContent=t(w?'win':'lose');
  $('rg').textContent=t('gain')+': +'+Math.floor(g)+' 🪙';
  $('nx').style.display=(w&&G.L<300)?'inline-block':'none';
  beep(w?880:110,.5);
  show('res');
}

function upd(dt){
  const L=G.L;
  G.en+=(5+S.up.en*1.8)*(S.cell=='animal'?1.5:1)*(S.pro?1.5:1)*dt;
  G.sp-=dt;
  if(G.left>0&&G.sp<=0){ G.sp=Math.max(0.4, 1.8-L*0.008); G.left--; spawn(); }

  for(const e of G.es){
    const d=E[e.i];
    if(e.x>C0+12) e.x-=d.sp*G.sm*dt;
    else G.wh-=d.d*(1+L*0.025)*dt;
  }

  for(const r of G.ts){
    r.cd-=dt;
    if(r.cd<=0 && G.es.some(e=>e.r==r.r && e.x>r.x)){
      r.cd=1.1/(1+0.12*S.up.cyto);
      G.bs.push({x:r.x+15, r:r.r, t:r.t});
    }
  }

  for(const b of G.bs){
    b.x+=360*dt;
    const e=G.es.find(e=>e.r==b.r && Math.abs(e.x-b.x)<16);
    if(e){
      e.hp-=TW[b.t].dmg*(1+0.15*S.up.wpn)*(E[e.i].tool==b.t?2.8:0.4)*(S.pro?1.3:1);
      b.x=9999;
      beep(350+b.t*120,.04);
    }
  }
  G.bs=G.bs.filter(b=>b.x<W+20);
  G.gain+=G.es.filter(e=>e.hp<=0).length*(2+(L>>3));
  G.es=G.es.filter(e=>e.hp>0);

  if(G.wh<=0) return end(false);
  if(G.left<=0&&!G.es.length) return end(true);
}

function draw(){
  cx.fillStyle='#010d06'; cx.fillRect(0,0,W,H);
  
  // رسم الشبكة المخبرية الأسطورية
  for(let r=0;r<5;r++) for(let c=0;c<10;c++){
    cx.fillStyle=(r+c)%2?'#021c0e':'#011409';
    cx.fillRect(C0+c*CW, r*RH, CW, RH);
    cx.strokeStyle='#032b16'; cx.lineWidth=1;
    cx.strokeRect(C0+c*CW, r*RH, CW, RH);
  }

  // رسم جدار الخلية البيولوجي (مصفح وأس نطاق)
  const pl=S.cell=='plant';
  cx.globalAlpha=0.4+0.6*Math.max(0,G.wh/G.wm);
  cx.fillStyle=pl?'#00aa44':'#ff3366';
  cx.fillRect(0,0,pl?C0:C0-15,H);
  cx.strokeStyle=pl?'#5fffa8':'#ff99bb'; cx.lineWidth=pl?5:3;
  cx.strokeRect(2,2,pl?C0-4:C0-17,H-4);
  cx.globalAlpha=1;

  // رسم الأبراج والأسلحة داخل الميدان
  cx.textAlign='center'; cx.font='22px Arial';
  for(const r of G.ts){
    cx.fillStyle='#000c'; cx.beginPath(); cx.arc(r.x, r.y, 22, 0, 7); cx.fill();
    cx.strokeStyle=TW[r.t].c; cx.lineWidth=2; cx.stroke();
    cx.fillText(TW[r.t].ic, r.x, r.y+8);
  }

  // رسم الأعداء (فيروسات، بكتيريا، فطريات) بأشكال دقيقة غير كرتونية
  for(const e of G.es){
    const y=e.r*RH+RH/2;
    cx.fillStyle=cx.strokeStyle=E[e.i].c; cx.lineWidth=2;
    cx.beginPath();
    if(e.i==0){ // فيروس
      cx.arc(e.x, y, 12, 0, 7); cx.fill();
      for(let a=0;a<6;a++){cx.moveTo(e.x,y); cx.lineTo(e.x+Math.cos(a*1.04)*18, y+Math.sin(a*1.04)*18);}
      cx.stroke();
    }else if(e.i==1){ // بكتيريا
      cx.ellipse(e.x, y, 18, 9, 0, 0, 7); cx.fill();
    }else{ // فطر
      cx.arc(e.x, y, 16, 0, 7); cx.fill();
      cx.fillStyle='#ffffff'; cx.fillRect(e.x-4, y-4, 8, 8);
    }
    // شريط الصحة للعدو
    cx.fillStyle='#440000'; cx.fillRect(e.x-14, y-24, 28, 4);
    cx.fillStyle='#00ff66'; cx.fillRect(e.x-14, y-24, 28*(e.hp/e.mx), 4);
  }

  // رسم طلقات المضادات الحيوية
  for(const b of G.bs){
    cx.fillStyle=TW[b.t].c; cx.beginPath(); cx.arc(b.x, b.r*RH+RH/2, 5, 0, 7); cx.fill();
  }

  if(G.paused){
    cx.fillStyle='#00ffcc'; cx.font='bold 36px Tahoma'; cx.textAlign='center';
    cx.fillText('PAUSED', W/2, H/2);
  }
}

function hud(){
  $('hc').textContent=Math.floor(S.coins+G.gain);
  $('he').textContent=Math.floor(G.en);
  $('hw').textContent=Math.max(0,Math.ceil(100*G.wh/G.wm))+'%';
  $('hl').textContent=G.L;
}

function loop(now){
  if(!G||!G.run) return;
  const dt=Math.min((now-last)/1000, 0.05); last=now;
  if(!G.paused) upd(dt);
  if(!G.run) return;
  draw(); hud();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', ev=>{
  if(!G||!G.run||G.paused) return;
  const r=cv.getBoundingClientRect();
  const x=(ev.clientX-r.left)*W/r.width, y=(ev.clientY-r.top)*H/r.height;
  const c=Math.floor((x-C0)/CW), row=Math.floor(y/RH);
  if(c<0||c>9||row<0||row>4) return;
  if(G.ts.some(o=>o.c==c && o.r==row)) return;
  const k=TW[G.sel];
  if(G.en<k.cost){beep(150,.2); return;}
  G.en-=k.cost;
  G.ts.push({x:C0+c*CW+CW/2, y:row*RH+RH/2, c, r:row, t:G.sel, cd:0});
  beep(600,.06);
});

refresh();
