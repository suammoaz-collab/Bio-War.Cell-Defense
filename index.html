<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Microbe War: Bio Defense</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
input{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;background:#12232a;color:#e6f0ea;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;background:linear-gradient(135deg,#17303a,#1f3f43);display:none;z-index:5;overflow:auto;padding:10px;text-align:center}
.scr.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.scr.top.on{justify-content:flex-start}
h1{margin:0}
h2{margin:0;font-size:20px;color:#c4e6d6}
.b{background:#3a6462;color:#e6f0ea;border:1px solid #79b1a2;border-radius:10px;padding:8px 16px;font-size:15px;margin:2px;font-family:inherit;cursor:pointer}
.b:active{background:#4f8a82}
.b:disabled{opacity:.4}
.tx{background:#13222a;color:#e6f0ea;border:1px solid #79b1a2;border-radius:10px;padding:8px;font-size:15px;width:160px;text-align:center;outline:none}
#splash{background:#0d171b;z-index:100}
#splash h1{font-size:36px;color:#e0463f;letter-spacing:3px;text-shadow:0 0 14px #e0463f55}
#splash p{margin:0;color:#e0463f;letter-spacing:7px;font-size:15px}
#menu.on{flex-direction:row;direction:ltr;justify-content:space-around}
#mside{display:flex;flex-direction:column;gap:8px}
.sq{width:80px;height:80px;border-radius:14px;background:#2f4f53;border:2px solid #6aa093;color:#e6f0ea;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;cursor:pointer}
.sq i{font-size:26px;font-style:normal}
.sq:active{background:#41706b}
#mmid{line-height:1.8}
.card{display:flex;align-items:center;gap:10px;background:#2c474d;border:1px solid #547f75;border-radius:12px;padding:8px 12px;margin:3px auto;font-size:13px;width:94%;max-width:560px;text-align:start}
#pk{display:flex;gap:12px;direction:ltr}
.cc{background:#2c474d;border:2px solid #6aa093;border-radius:14px;padding:8px;width:210px;color:#e6f0ea;font-family:inherit;font-size:12px;line-height:1.7;cursor:pointer}
.cc.sel{background:#41706b;border-color:#b2ecd0}
#game{position:fixed;inset:0;display:none;flex-direction:row;direction:ltr;background:#12232a}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:32px;display:flex;align-items:center;gap:9px;padding:0 8px;font-size:13px;background:#1b343b;white-space:nowrap;overflow:hidden}
.bat{display:inline-block;width:36px;height:15px;border:2px solid #d3e6dc;border-radius:4px;position:relative;vertical-align:middle}
.bat b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#4f9a62;transition:width 0.2s}
.mini{background:#3a6462;color:#e6f0ea;border:1px solid #79b1a2;border-radius:6px;font-size:13px;padding:1px 8px;cursor:pointer}
#cw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#cv{touch-action:none}
#side{width:90px;padding:4px;display:flex;flex-direction:column;gap:4px;background:#1b343b;justify-content:center}
.tl{flex:1;max-height:84px;background:#2f4f53;border:2px solid #547f75;border-radius:12px;color:#e6f0ea;font-size:11px;font-family:inherit;line-height:1.3;padding:4px;cursor:pointer}
.tl.sel{border-color:#b2ecd0;background:#437873}
</style></head><body>

<div class="scr on" id="splash"><canvas id="lg" width="120" height="80"></canvas><h1>MICROBE WAR</h1><p>BIO DEFENSE</p></div>

<div class="scr" id="menu">
<div id="mside">
<button class="sq" onclick="show('pick')"><i>▶</i><span data-t="play"></span></button>
<button class="sq" onclick="show('shop')"><i>🛒</i><span data-t="shop"></span></button>
<button class="sq" onclick="show('set')"><i>⚙️</i><span data-t="settings"></span></button></div>
<div id="mmid"><h2>MICROBE WAR</h2><div style="color:#9fcfba">BIO DEFENSE</div>
<div style="margin-top:14px"><span data-t="level"></span> <b id="lv"></b></div>
<div>🪙 <b id="mc"></b> <b id="pb"></b></div></div></div>

<div class="scr top" id="shop"><h2><span data-t="shop"></span> 🪙 <span id="sc"></span></h2><div id="ups" style="width:100%;max-width:400px"></div>
<button class="b" onclick="show('menu')" data-t="back"></button></div>

<div class="scr top" id="set"><h2 data-t="settings"></h2>
<div style="margin:6px 0"><span data-t="sound"></span> <input type="range" id="vol" min="0" max="1" step="0.1" style="width:140px" oninput="state.vol=+this.value;save();beep(500,.1)"></div>
<div style="margin:6px 0"><span data-t="lang"></span> <button class="b" onclick="setLang('ar')">عربي</button><button class="b" onclick="setLang('en')">English</button></div>
<div style="margin:6px 0"><button class="b" onclick="show('book')" data-t="book"></button></div>
<h2 data-t="codes"></h2>
<div><input class="tx" id="cd" data-ph="code"> <button class="b" onclick="promo()" data-t="apply"></button></div>
<div id="pm" style="color:#ffcc00;margin-top:4px;min-height:18px"></div>
<button class="b" onclick="show('menu')" data-t="back"></button></div>

<div class="scr top" id="book"><h2 data-t="book"></h2><div id="bk" style="width:100%"></div>
<button class="b" onclick="show('set')" data-t="back"></button></div>

<div class="scr" id="pick"><h2 data-t="choose"></h2><div><span data-t="level"></span> <b id="pl"></b></div><div id="pk"></div>
<div style="margin-top:10px"><button class="b" onclick="startGame()" style="font-size:18px;padding:8px 24px">▶ <span data-t="play"></span></button></div>
<button class="b" onclick="show('menu')" data-t="back"></button></div>

<div class="scr" id="res"><h1 id="rt"></h1><div id="rg" style="font-size:18px;color:#ffcc00;margin:8px 0"></div>
<div><button class="b" id="nx" onclick="nextL()" data-t="next"></button><button class="b" onclick="startGame()" data-t="retry"></button><button class="b" onclick="show('menu')" data-t="menu"></button></div></div>

<div id="game"><div id="mn">
<div id="top"><span class="bat"><b id="bf"></b></span><b id="hw">96%</b><span>🛡️<b id="hs">100%</b></span><span>🪙<b id="hc">0</b></span><span>⚡<b id="he">0</b></span><span><span data-t="level"></span> <b id="hl">1</b></span><span>🦠<b id="hn">0</b></span>
<button class="mini" onclick="G.paused=!G.paused">⏸</button><button class="mini" onclick="show('menu')">✖</button></div>
<div id="cw"><canvas id="cv" width="900" height="420"></canvas></div></div>
<div id="side">
<button class="tl" id="tb0" onclick="sel(0)"></button><button class="tl" id="tb1" onclick="sel(1)"></button><button class="tl" id="tb2" onclick="sel(2)"></button><button class="tl" id="tb3" onclick="sel(3)"></button></div></div>

<script>
'use strict';
const TXT={
ar:{play:"العب",shop:"المتجر",settings:"الإعدادات",book:"📖 كتاب الميكروبات (Book History)",back:"رجوع",sound:"الصوت",lang:"اللغة",codes:"🎁 استبدال الأكواد",choose:"اختر خليتك",
animal:"الخلية الحيوانية",plant:"الخلية النباتية",
animalP:"⚡ طاقة أسرع<br>🔫 إطلاق أسرع 20%<br>🛡️ جدار عادي",
plantP:"🛡️ جدار خلوي قوي ×2.5<br>🌿 الجدار يتجدد<br>⚡ طاقة عادية",
level:"المستوى",up_wall:"الجدار الخلوي",up_cyto:"قوة السيتوبلازم",up_en:"إنتاج الطاقة",up_wpn:"الأسلحة والمضادات",
code:"اكتب الكود",apply:"تفعيل",bad:"كود غير صحيح",used:"الكود مستخدم من قبل",pro:"تم فتح حساب PRO!",
win:"انتصار!",lose:"النواة سقطت!",next:"التالي",retry:"إعادة",menu:"القائمة",weak:"نقطة الضعف",gain:"الكوينز المكتسبة",
t0:"ميتوكوندريا",t1:"مضاد حيوي",t2:"مضاد فيروسات",t3:"مضاد فطريات",
n0:"فيروس الإنفلونزا",d0:"كرة صغيرة بنتوءات، سريعة وضعيفة.",
n1:"فيروس العاقمة",d1:"رأس سداسي وأرجل، سريع جداً.",
n2:"بكتيريا كروية",d2:"خلايا مستديرة متجمعة، متوسطة القوة.",
n3:"بكتيريا عصوية",d3:"جسم طويل وسوط، قوية وبطيئة.",
n4:"الفطر",d4:"بطيء وصلب وصحته كبيرة."},
en:{play:"Play",shop:"Shop",settings:"Settings",book:"📖 Book History",back:"Back",sound:"Sound",lang:"Language",codes:"🎁 Redeem Codes",choose:"Choose your cell",
animal:"Animal Cell",plant:"Plant Cell",
animalP:"⚡ Faster energy<br>🔫 20% faster fire<br>🛡️ Normal wall",
plantP:"🛡️ Strong cell wall x2.5<br>🌿 Wall regenerates<br>⚡ Normal energy",
level:"Level",up_wall:"Cell Wall",up_cyto:"Cytoplasm Power",up_en:"Energy Production",up_wpn:"Weapons & Antibiotics",
code:"Enter code",apply:"Apply",bad:"Invalid code",used:"Code already used",pro:"PRO Account Unlocked!",
win:"Victory!",lose:"The nucleus fell!",next:"Next",retry:"Retry",menu:"Menu",weak:"Weakness",gain:"Coins earned",
t0:"Mitochondria",t1:"Antibiotic",t2:"Antiviral",t3:"Antifungal",
n0:"Flu Virus",d0:"Small spiky ball, fast and weak.",
n1:"Bacteriophage",d1:"Hexagon head with legs, very fast.",
n2:"Coccus Bacteria",d2:"Round clustered cells, medium strength.",
n3:"Bacillus Bacteria",d3:"Long body with a flagellum, strong and slow.",
n4:"Fungus",d4:"Slow and tough with lots of health."}};

const SAVE_KEY='mw3';
const state={coins:100,lvl:1,cell:'animal',up:{wall:0,cyto:0,en:0,wpn:0},pro:false,used:[],vol:.5,lang:'ar'};
const ENEMIES=[
{hp:30,sp:40,dmg:5,col:'#ee8fa8',weak:2,unlock:1},
{hp:45,sp:55,dmg:6,col:'#b8a0e6',weak:2,unlock:4},
{hp:70,sp:28,dmg:8,col:'#e8b866',weak:1,unlock:2},
{hp:100,sp:24,dmg:11,col:'#ec9a68',weak:1,unlock:8},
{hp:160,sp:14,dmg:15,col:'#74bddc',weak:3,unlock:14}];
const TOOLS=[
{cost:50,col:'#f0c36a',ic:'⚡',dmg:0},
{cost:75,col:'#8fd19e',ic:'💊',dmg:10},
{cost:100,col:'#7fd0e0',ic:'💉',dmg:10},
{cost:125,col:'#e6d37a',ic:'🧪',dmg:14}];

const $=id=>document.getElementById(id);
const t=k=>TXT[state.lang][k]||k;

try{Object.assign(state,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}

let audioCtx;
function beep(f,d){
 if(!state.vol)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=f;g.gain.value=state.vol*.12;
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);
 }catch(e){}
}

const W=900,H=420,CX=450,CY=210,TAU=Math.PI*2;
let G=null,last=0;

// زوال شاشة الانترو بسرعة (خلال ثانيتين فقط)
setTimeout(()=>{
 const s=$('splash');
 if(s){
  s.style.transition='opacity 0.4s';
  s.style.opacity='0';
  setTimeout(()=>{ s.classList.remove('on'); show('menu'); }, 400);
 }
}, 2000);

function rr(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
 c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function edgeVal(pl,dx,dy){return pl?Math.max(Math.abs(dx)/185,Math.abs(dy)/165):Math.hypot(dx/195,dy/170)}

function drawEnemy(c,i,x,y,s,col,ang,tm){
 c.save();c.translate(x,y);c.rotate(ang||0);
 const k=s*(1+.05*Math.sin((tm||0)*6+i));c.scale(k,k);
 c.fillStyle=c.strokeStyle=col||ENEMIES[i].col;c.lineWidth=2.4;c.lineCap='round';
 if(i==0){
  c.beginPath();c.arc(0,0,12,0,TAU);c.fill();
  for(let a=0;a<10;a++){const q=a*.628,x1=Math.cos(q),y1=Math.sin(q);
   c.beginPath();c.moveTo(x1*12,y1*12);c.lineTo(x1*19,y1*19);c.stroke();
   c.beginPath();c.arc(x1*20,y1*20,2.6,0,TAU);c.fill()}
 }else if(i==1){
  c.beginPath();for(let a=0;a<6;a++){const q=a*1.047;c.lineTo(8+Math.cos(q)*11,Math.sin(q)*11)}c.closePath();c.fill();
  c.beginPath();c.moveTo(-3,0);c.lineTo(-14,0);c.stroke();
  c.fillRect(-14,-5,3,10);
  for(const d of [-9,0,9]){c.beginPath();c.moveTo(-14,0);c.lineTo(-24,d);c.stroke()}
 }else if(i==2){
  for(const p of [[-7,-5],[5,-7],[0,3],[-10,6],[10,4]]){c.beginPath();c.arc(p[0],p[1],7,0,TAU);c.fill()}
 }else if(i==3){
  c.beginPath();c.ellipse(4,0,17,8,0,0,TAU);c.fill();
  c.beginPath();c.moveTo(-13,0);c.quadraticCurveTo(-19,-8,-24,0);c.quadraticCurveTo(-29,8,-34,0);c.stroke();
 }else{
  c.beginPath();c.arc(0,0,12,0,TAU);c.fill();
  for(let a=0;a<6;a++){const q=a*1.047+.3,r=22+(a%2)*5,x1=Math.cos(q),y1=Math.sin(q);
   c.beginPath();c.moveTo(x1*10,y1*10);c.lineTo(x1*r,y1*r);c.stroke();
   c.beginPath();c.arc(x1*r,y1*r,5,0,TAU);c.fill()}
 }
 c.fillStyle='#ffffff55';c.beginPath();c.arc(-2,-4,4,0,TAU);c.fill();
 c.fillStyle='#2a1a2a';c.beginPath();c.arc(6,-4,2,0,TAU);c.arc(6,4,2,0,TAU);c.fill();
 c.restore();
}

const ORG=[[-120,-60,10],[110,-70,12],[-100,75,9],[125,60,11],[0,-112,8],[-20,118,10],[75,98,7],[-145,5,8],[145,0,9]];
function drawNucleus(c,tm,hr){
 c.save();
 const g=c.createRadialGradient(-10,-10,5,0,0,46);g.addColorStop(0,'#c9a2e0');g.addColorStop(1,'#7f5bab');
 const p=1+.03*Math.sin(tm*3);
 c.scale(p,p);
 c.beginPath();c.arc(0,0,44,0,TAU);c.fillStyle=g;c.fill();
 c.lineWidth=5;c.strokeStyle=hr>.4?'#e4cdf2':'#e0675f';c.stroke();
 c.fillStyle='#4f3375';c.beginPath();c.arc(-6,-4,15,0,TAU);c.fill();
 c.fillStyle='#ffffff44';c.beginPath();c.arc(-12,-10,5,0,TAU);c.fill();
 c.restore();
}
function drawBody(c,pl,tm,wr,hr){
 c.save();
 if(pl){
  rr(c,-185,-165,370,330,40);c.fillStyle='#aad8aa';c.fill();
  c.globalAlpha=.35+.65*wr;c.lineWidth=14;c.strokeStyle='#4f9a62';c.stroke();c.globalAlpha=1;
  c.lineWidth=3;c.strokeStyle='#d6f0d6';rr(c,-177,-157,354,314,34);c.stroke();
  c.fillStyle='#9ad4e099';c.beginPath();c.ellipse(-95,70,48,64,.4,0,TAU);c.fill();
  c.fillStyle='#58a85c';
  for(const o of ORG){c.beginPath();c.ellipse(o[0],o[1],o[2]+6,o[2]-1,o[0]*.02,0,TAU);c.fill()}
 }else{
  c.beginPath();c.ellipse(0,0,195,170,0,0,TAU);c.fillStyle='#ebc6d3';c.fill();
  c.globalAlpha=.35+.65*wr;c.lineWidth=7;c.strokeStyle='#f8dfe9';c.stroke();c.globalAlpha=1;
  c.fillStyle='#e8a76f';
  for(const o of ORG){c.beginPath();c.ellipse(o[0],o[1],o[2]+7,o[2]-2,o[1]*.02,0,TAU);c.fill()}
  c.strokeStyle='#d99ab0';c.lineWidth=4;c.lineCap='round';
  for(let k=0;k<3;k++){c.beginPath();c.moveTo(70,-60+k*9);c.quadraticCurveTo(100,-70+k*9,130,-60+k*9);c.stroke()}
 }
 drawNucleus(c,tm,hr);
 c.restore();
}

function show(id){
 document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));
 $('game').style.display=id=='game'?'flex':'none';
 if(id!='game'&&G)G.run=false;
 refresh();
}

function setLang(l){state.lang=l;save();refresh();}

function refresh(){
 document.documentElement.lang=state.lang;
 document.documentElement.dir=state.lang=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t(e.dataset.t));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 
 $('lv').textContent=state.lvl;
 $('pl').textContent=state.lvl;
 $('mc').textContent=Math.floor(state.coins);
 $('sc').textContent=Math.floor(state.coins);
 $('pb').textContent=state.pro?'⭐ VIP PRO':'';
 $('vol').value=state.vol;

 let pkHtml='';
 for(const type of ['animal','plant']){
  pkHtml+=`<div class="cc ${state.cell==type?'sel':''}" onclick="pick('${type}')"><b>${t(type)}</b><br>${t(type+'P')}</div>`;
 }
 $('pk').innerHTML=pkHtml;

 let u='';
 for(const k of ['wall','cyto','en','wpn']){
  const n=state.up[k];
  u+=`<div style="margin:4px 0"><button class="b" style="width:100%" ${n>=15?'disabled':''} onclick="buy('${k}')">${t('up_'+k)} [${n}/15] — ${n>=15?'MAX':cost(k)+' 🪙'}</button></div>`;
 }
 $('ups').innerHTML=u;

 let b='';
 for(let i=0;i<ENEMIES.length;i++){
  b+=`<div class="card"><b>${t('n'+i)}</b><br>${t('d'+i)}<br><b>${t('weak')}:</b> ${TOOLS[ENEMIES[i].weak].ic} ${t('t'+ENEMIES[i].weak)}</div>`;
 }
 $('bk').innerHTML=b;

 for(let i=0;i<4;i++) $('tb'+i).innerHTML=TOOLS[i].ic+'<br>'+t('t'+i)+'<br>'+TOOLS[i].cost+'⚡';
 if(G)sel(G.sel);
}

function cost(k){return Math.round(80*Math.pow(state.up[k]+1,1.5))}
function buy(k){
 if(state.up[k]>=15||state.coins<cost(k)){beep(150,.2);return}
 state.coins-=cost(k);state.up[k]++;save();beep(700,.1);refresh();
}
function promo(){
 const c=$('cd').value.trim().toUpperCase();
 if(c==='MARWAN_PRO'||c==='REV_VIP'||c.startsWith('PRO-')){
  if(state.used.includes(c)){$('pm').textContent=t('used');beep(150,.2)}
  else{state.used.push(c);state.coins+=50000;state.pro=true;save();$('pm').textContent=t('pro')+' +50,000 🪙';beep(900,.3)}
 }else{$('pm').textContent=t('bad');beep(120,.2)}
 refresh();
}
function pick(c){state.cell=c;save();refresh()}
function sel(i){if(G)G.sel=i;for(let j=0;j<4;j++)$('tb'+j).classList.toggle('sel',j==i)}

function startGame(){
 const pl=state.cell=='plant', L=state.lvl;
 const maxW=(200+state.up.wall*60)*(pl?2.5:1);
 G={
  en:120, wallHp:maxW, maxWall:maxW, nucHp:100, es:[], ts:[], bs:[], sel:0,
  spTimer:1, left:10+L*2, gain:0, run:true, paused:false, L, pl,
  hm:1+(L-1)*.05, sm:1+Math.min((L-1)*.003,1.2)
 };
 show('game');G.run=true;
 last=performance.now();requestAnimationFrame(loop);
}

function nextL(){state.lvl=Math.min(state.lvl+1,300);save();startGame()}

function spawn(){
 const L=G.L, av=L>=14?5:L>=8?4:L>=4?3:L>=2?2:1;
 const i=Math.floor(Math.random()*av);
 const a=Math.random()*TAU, r=260;
 const hp=ENEMIES[i].hp*G.hm;
 G.es.push({x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,hp,mx:hp,i});
}

function end(w){
 G.run=false;let g=G.gain;
 if(w){g+=30+G.L*5;state.lvl=Math.min(state.lvl+1,300)}
 state.coins+=g;save();
 $('rt').textContent=t(w?'win':'lose');
 $('rg').textContent=t('gain')+': +'+Math.floor(g)+' 🪙';
 $('nx').style.display=w?'inline-block':'none';
 beep(w?880:110,.4);show('res');
}

function upd(dt){
 G.en += (6 + state.up.en * 1.8) * (G.pl?1:1.4) * (state.pro?1.5:1) * dt;
 G.spTimer -= dt;
 if(G.left>0 && G.spTimer<=0){
  G.spTimer = Math.max(0.4, 2.0 - G.L*0.005);
  G.left--; spawn();
 }

 const cv=$('cv'), cx=cv.getContext('2d');
 for(const e of G.es){
  const dx=e.x-CX, dy=e.y-CY, dist=Math.hypot(dx,dy);
  const ang=Math.atan2(-dy,-dx);
  if(dist > 45){
   e.x += Math.cos(ang) * ENEMIES[e.i].sp * G.sm * dt;
   e.y += Math.sin(ang) * ENEMIES[e.i].sp * G.sm * dt;
  }
  
  if(edgeVal(G.pl, e.x-CX, e.y-CY) <= 1.0 && G.wallHp > 0){
   G.wallHp -= ENEMIES[e.i].dmg * dt;
  }
  if(dist <= 48){
   G.nucHp -= ENEMIES[e.i].dmg * 1.5 * dt;
  }
 }

 for(const r of G.ts){
  r.cd -= dt;
  if(r.cd <= 0){
   let target = null, minDist = 999;
   for(const e of G.es){
    const d = Math.hypot(e.x-r.x, e.y-r.y);
    if(d < minDist){ minDist = d; target = e; }
   }
   if(target && minDist < 180){
    r.cd = 0.9 / (1 + 0.12*state.up.cyto);
    G.bs.push({x:r.x, y:r.y, tx:target.x, ty:target.y, t:r.t, target});
   }
  }
 }

 for(const b of G.bs){
  const dx=b.tx-b.x, dy=b.ty-b.y, dist=Math.hypot(dx,dy);
  if(dist < 8 && b.target){
   b.target.hp -= TOOLS[b.t].dmg * (1 + 0.15*state.up.wpn) * (ENEMIES[b.target.i].weak==b.t ? 2.5 : 0.5);
   b.dead = true;
  }else{
   b.x += (dx/dist) * 320 * dt;
   b.y += (dy/dist) * 320 * dt;
  }
 }
 G.bs = G.bs.filter(b=>!b.dead && b.x>0 && b.x<W && b.y>0 && b.y<H);
 G.gain += G.es.filter(e=>e.hp<=0).length * 4;
 G.es = G.es.filter(e=>e.hp>0);

 if(G.nucHp <= 0) return end(false);
 if(G.left <= 0 && !G.es.length) return end(true);
}

function draw(){
 const cv=$('cv'), cx=cv.getContext('2d');
 cx.fillStyle='#12232a'; cx.fillRect(0,0,W,H);
 
 cx.save(); cx.translate(CX, CY);
 drawBody(cx, G.pl, performance.now()/1000, G.wallHp/G.maxWall, G.nucHp/100);
 cx.restore();

 for(const r of G.ts){
  cx.fillStyle='#2f4f53'; cx.beginPath(); cx.arc(r.x, r.y, 16, 0, TAU); cx.fill();
  cx.strokeStyle=TOOLS[r.t].col; cx.lineWidth=2; cx.stroke();
  cx.font='16px Arial'; cx.textAlign='center'; cx.fillText(TOOLS[r.t].ic, r.x, r.y+5);
 }

 for(const e of G.es){
  const ang=Math.atan2(CY-e.y, CX-e.x);
  drawEnemy(cx, e.i, e.x, e.y, 0.9, null, ang, performance.now()/1000);
  cx.fillStyle='#111'; cx.fillRect(e.x-12, e.y-20, 24, 3);
  cx.fillStyle='#4f9a62'; cx.fillRect(e.x-12, e.y-20, 24*(e.hp/e.mx), 3);
 }

 for(const b of G.bs){
  cx.fillStyle=TOOLS[b.t].col; cx.beginPath(); cx.arc(b.x, b.y, 4, 0, TAU); cx.fill();
 }
}

function hud(){
 $('hc').textContent = Math.floor(state.coins + G.gain);
 $('he').textContent = Math.floor(G.en);
 $('hw').textContent = Math.max(0, Math.ceil(G.nucHp)) + '%';
 $('hs').textContent = Math.max(0, Math.ceil(100 * G.wallHp / G.maxWall)) + '%';
 $('hl').textContent = G.L;
 $('hn').textContent = G.es.length + G.left;
 $('bf').style.width = Math.max(0, (G.nucHp)) + '%';
}

function loop(now){
 if(!G || !G.run) return;
 const dt = Math.min((now-last)/1000, 0.05); last=now;
 if(!G.paused) upd(dt);
 draw(); hud();
 requestAnimationFrame(loop);
}

const cv=$('cv');
cv.addEventListener('pointerdown', ev=>{
 if(!G || !G.run || G.paused) return;
 const r = cv.getBoundingClientRect();
 const x = (ev.clientX-r.left)*W/r.width, y = (ev.clientY-r.top)*H/r.height;
 if(Math.hypot(x-CX, y-CY) < 45) return;
 if(G.ts.some(o=>Math.hypot(o.x-x, o.y-y) < 28)) return;
 const k = TOOLS[G.sel];
 if(G.en < k.cost){ beep(150,.2); return; }
 G.en -= k.cost;
 G.ts.push({x, y, t: G.sel, cd: 0});
 beep(500,.05);
});

refresh();
</script></body></html>
